[package]
name = "dji-telemetry-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Extract accelerometer, attitude, exposure and GPS telemetry from DJI Osmo Action MP4 files and export it as CSV / SRT / VBO / GPX / FIT / IGC for OVRLEY"
license = "MIT"
repository = "https://github.com/DaniilDem/dji-telemetry-export"

[[bin]]
name = "dji-telemetry-export"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
fitparser = "0.11"
roxmltree = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
